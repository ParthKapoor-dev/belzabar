# Builds the belz Linux binary and publishes the "cloud bundle" to the
# belz-sandbox repo, so Claude Code cloud sessions always get the latest belz
# WITHOUT ever attaching the private belzabar repo.
#
# What it does (see cloud/publish.sh):
#   • compiles belz-linux-x64 and uploads it to a rolling Release on belz-sandbox
#   • syncs the cloud rules + setup script into belz-sandbox
#
# Required configuration:
#   secret  WI_IMPL_SANDBOX_TOKEN  — fine-grained PAT with Contents: read & write
#                                 on the belz-sandbox repo ONLY (NOT belzabar).
#   variable WI_IMPL_SANDBOX_REPO  — e.g. "your-org/belz-sandbox".
#   (Both are also read under their names before the rename, BELZ_SANDBOX_*.)
#
# Why a separate repo + scoped token: GitHub has no "releases-only" scope, so a
# token that could read a release on belzabar could also clone belzabar's
# source. Publishing to belz-sandbox keeps the cloud token unable to reach
# belzabar at all.

name: belz-cloud-release

on:
  push:
    branches: [main]
    paths:
      - "apps/cli/**"
      - "integrations/**"
      - "packages/**"
      - "cloud/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: belz-cloud-release
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # No-op until you opt in by setting the WI_IMPL_SANDBOX_REPO repo variable, so
    # this never fails CI on belzabar for an unconfigured optional feature.
    if: (vars.WI_IMPL_SANDBOX_REPO || vars.BELZ_SANDBOX_REPO) != ''
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the CI version (ci.yml): the stdout-flush workaround is
          # tied to Bun 1.2.x pipe behaviour; bump every workflow together.
          bun-version: 1.2.20

      - name: Publish cloud bundle to belz-sandbox
        env:
          GH_TOKEN: ${{ secrets.WI_IMPL_SANDBOX_TOKEN || secrets.BELZ_SANDBOX_TOKEN }}
          SANDBOX_REPO: ${{ vars.WI_IMPL_SANDBOX_REPO || vars.BELZ_SANDBOX_REPO }}
        run: bash cloud/publish.sh
