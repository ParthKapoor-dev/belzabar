name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: the runner's stdout-flush workaround is tied to
          # Bun 1.2.x pipe behaviour; bump deliberately, with the pipe tests.
          bun-version: 1.2.20

      # --ignore-scripts: the root package's lifecycle scripts must never run
      # the belz installer. --frozen-lockfile: test exactly the
      # committed dependency set.
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      # Every workspace, integration tests included. Blocking.
      - name: Typecheck
        run: bun run typecheck

      # Every repo path and `belz <cmd>` named in AGENTS.md/README.md exists.
      - name: Docs check
        run: bun run docs:check

      # Unused or file-local exports, unreachable files, undeclared or unused
      # deps (scripts/dead-code.ts). Blocking: any finding but a test seam fails.
      - name: Dead code
        run: bun run dead-code

      # Unit + contract + compiled-binary pipe tests. Live suites are skipped
      # unless WI_IMPL_LIVE is set, which CI never does.
      - name: Test
        run: bun run test
